info:
  name: P10 Rolle löschen
  type: http
  seq: 10

http:
  method: DELETE
  url: "{{baseUrl}}/v1/tapes/{{tapeId}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", () => expect(res.status).to.equal(200));
        test("Meldung 'Tape deleted'", () => expect(res.body.message).to.equal("Tape deleted"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
