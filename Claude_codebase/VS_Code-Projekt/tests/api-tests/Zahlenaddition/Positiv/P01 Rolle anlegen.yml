info:
  name: P01 Rolle anlegen
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/v1/tapes"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "{}"

runtime:
  scripts:
    - type: after-response
      code: if (res.status === 201) bru.setVar("tapeId", res.body.id);
    - type: tests
      code: |-
        test("Status 201", () => expect(res.status).to.equal(201));
        test("Antwort enthält numerische id", () => expect(res.body.id).to.be.a("number"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
