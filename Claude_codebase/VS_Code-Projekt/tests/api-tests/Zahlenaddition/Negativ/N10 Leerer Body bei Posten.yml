info:
  name: N10 Leerer Body bei Posten
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/v1/tapes/{{negTapeId}}/entries"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: ""

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 400", () => expect(res.status).to.equal(400));
        test("Fehler invalid_number mit leerem Objekt", () => {
          expect(res.body.error).to.equal("invalid_number");
          expect(res.body.value).to.deep.equal({});
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
