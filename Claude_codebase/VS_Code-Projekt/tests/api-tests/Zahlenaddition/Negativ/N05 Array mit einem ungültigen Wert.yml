info:
  name: N05 Array mit einem ungültigen Wert
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/v1/tapes/{{negTapeId}}/entries"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "[{{testwert01}}, \"abc\", {{testwert02}}]"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 400", () => expect(res.status).to.equal(400));
        test("Fehler invalid_number für den ungültigen Wert", () => {
          expect(res.body.error).to.equal("invalid_number");
          expect(res.body.value).to.equal("abc");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
