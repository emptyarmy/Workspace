info:
  name: N16 Posten zu unbekannter Rolle
  type: http
  seq: 16

http:
  method: POST
  url: "{{baseUrl}}/v1/tapes/{{unbekannteTapeId}}/entries"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "{{testwert03}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 404", () => expect(res.status).to.equal(404));
        test("Fehler 'Tape not found'", () => expect(res.body.error).to.equal("Tape not found"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
