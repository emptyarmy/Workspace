<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zahlen-Addierer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Willkommen beim Zahlen-Addierer!</h1>
      <p class="intro">
        Geben Sie zwei Zahlen ein und klicken Sie auf „Addiere“, um die Summe zu berechnen.
      </p>

      <form id="calc-form" novalidate>
        <div class="field">
          <label for="zahl1">Erste Zahl</label>
          <input id="zahl1" type="text" inputmode="decimal" autocomplete="off" placeholder="z. B. 12,5" />
        </div>

        <div class="field">
          <label for="zahl2">Zweite Zahl</label>
          <input id="zahl2" type="text" inputmode="decimal" autocomplete="off" placeholder="z. B. 7" />
        </div>

        <button type="submit" id="addiere">Addiere</button>

        <div class="field">
          <label for="ergebnis">Ergebnis</label>
          <input id="ergebnis" type="text" readonly tabindex="-1" />
        </div>
      </form>

      <p id="meldung" class="meldung" role="alert" aria-live="polite" hidden></p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
