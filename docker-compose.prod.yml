# AI_TPI – Betrieb mit Docker Compose (Phase 8c, docs/06_betrieb/01_installation.md).
#
#   cp .env.production.example .env.production   # Werte eintragen (Geheimnisse!)
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.production exec app ai-tpi-setup
#
# Die Anwendung lauscht nur auf 127.0.0.1:${APP_PORT:-3000}. Davor gehört ein Reverse Proxy mit HTTPS
# (z. B. Caddy, nginx, Traefik); dann TRUST_PROXY=true. Die Datenbank ist von außen nicht erreichbar.
name: ai-tpi

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_tpi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt (.env.production)}
      POSTGRES_DB: ${POSTGRES_DB:-ai_tpi}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    image: ${APP_IMAGE:-ai-tpi:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ai_tpi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ai_tpi}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL fehlt (.env.production)}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?SECRET_ENCRYPTION_KEY fehlt (.env.production)}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      SETUP_ENABLED: ${SETUP_ENABLED:-true}
      MAIL_TRANSPORT: smtp
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST fehlt (.env.production)}
      SMTP_PORT: ${SMTP_PORT:-587}
      MAIL_FROM: ${MAIL_FROM:-AI_TPI <no-reply@example.com>}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_RATE_LIMIT_PER_MIN: ${AUTH_RATE_LIMIT_PER_MIN:-30}
      RESET_MAILS_PER_15_MIN: ${RESET_MAILS_PER_15_MIN:-3}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  db-data:
